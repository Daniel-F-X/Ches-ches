<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Producto | Mi Tabla</title>

    <link
        rel="stylesheet"
        href="CSS/styles.css">

</head>


<body>

    <!-- NAVEGACIÓN -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo">

            MI TABLA

        </a>


        <button
            class="menu-toggle"
            id="menuToggle">

            ☰

        </button>


        <nav
            class="nav-menu"
            id="navMenu">

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Inicio
                    </a>
                </li>

                <li>
                    <a href="index.html#tablas">
                        Tablas
                    </a>
                </li>

                <li>
                    <a href="index.html#personaliza">
                        Arma tu tabla
                    </a>
                </li>

                <li>
                    <a href="index.html#nosotros">
                        Nosotros
                    </a>
                </li>

            </ul>

        </nav>


        <a
            href="#"
            class="carrito">

            🛒

        </a>

    </header>


    <!-- PRODUCTO -->

    <main>

        <section class="producto-detalle">

            <div class="producto-detalle-imagen">

                <img
                    id="productoImagen"
                    src=""
                    alt="Producto">

            </div>


            <div class="producto-detalle-info">

                <p
                    class="seccion-etiqueta"
                    id="productoCategoria">
                </p>


                <h1 id="productoNombre">
                    Producto
                </h1>


                <p
                    class="producto-descripcion"
                    id="productoDescripcion">
                </p>


                <div class="producto-precio">

                    $<span id="productoPrecio">
                        0
                    </span>

                </div>


                <!-- INCLUIDO -->

                <div class="detalle-seccion">

                    <h3>
                        Incluye
                    </h3>

                    <ul id="productoIncluye">
                    </ul>

                </div>


                <!-- EXTRAS -->

                <div class="detalle-seccion">

                    <h3>
                        Agrega adicionales
                    </h3>


                    <div
                        class="extras"
                        id="extras">

                    </div>

                </div>


                <!-- TOTAL -->

                <div class="producto-total">

                    <span>
                        Total
                    </span>

                    <strong id="productoTotal">
                        $0
                    </strong>

                </div>


                <button
                    class="btn-agregar"
                    id="btnAgregar">

                    AGREGAR AL CARRITO

                </button>


                <a
                    href="index.html#tablas"
                    class="volver">

                    ← Volver a las tablas

                </a>

            </div>

        </section>

    </main>


    <script src="JS/producto.js"></script>

</body>

</html>
